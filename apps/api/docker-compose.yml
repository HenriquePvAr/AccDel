services:
  postgres:
    image: postgres:16-alpine
    container_name: cain-delivery-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cain_delivery_admin
    ports:
      - "5432:5432"
    volumes:
      - cain_delivery_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cain_delivery_admin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cain_delivery_pgdata:
