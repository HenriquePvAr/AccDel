name: CI / API

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - release/pilot-rc2
      - ci/pilot-rc2-validation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  APP_ENV: test
  NODE_ENV: test
  WHATSAPP_PROVIDER: disabled
  AI_PROVIDER: disabled
  MESSAGING_SANDBOX_MODE: "true"
  FEATURE_WHATSAPP_ENABLED: "false"
  FEATURE_AI_ATTENDANT_ENABLED: "false"

jobs:
  api-unit:
    name: API build, lint and 65 unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://cain_ci:cain-ci-only-password@127.0.0.1:5432/accdel_security_test?schema=public
      DIRECT_URL: postgresql://cain_ci:cain-ci-only-password@127.0.0.1:5432/accdel_security_test?schema=public
    defaults:
      run:
        shell: bash
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npx --no-install prisma validate

      - name: Build API
        run: npm run build

      - name: Lint API
        run: npm run lint

      - name: Run API unit tests
        run: npm run test

      - name: Confirm tracked files are unchanged
        run: git -C ../.. diff --exit-code

  api-postgres:
    name: API PostgreSQL migrations and integrations
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: cain_ci
          POSTGRES_PASSWORD: cain-ci-only-password
          POSTGRES_DB: accdel_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cain_ci -d accdel_security_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://cain_ci:cain-ci-only-password@127.0.0.1:5432/accdel_security_test?schema=public
      DIRECT_URL: postgresql://cain_ci:cain-ci-only-password@127.0.0.1:5432/accdel_security_test?schema=public
      RUN_DB_INTEGRATION: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install locked API dependencies
        run: npm ci
        working-directory: apps/api

      - name: Generate Prisma Client
        run: npm run prisma:generate
        working-directory: apps/api

      - name: Apply migrations to the integration database
        run: npm run prisma:migrate
        working-directory: apps/api

      - name: Run PostgreSQL integration tests
        run: npm run test:integration
        working-directory: apps/api

      - name: Confirm tracked files are unchanged
        run: git diff --exit-code
