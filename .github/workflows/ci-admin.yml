name: CI / Admin

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - release/pilot-rc2
      - ci/pilot-rc2-validation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-admin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  admin:
    name: Admin build, lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build Admin
        run: npm run build

      - name: Lint Admin
        run: npm run lint

      - name: Test Admin
        run: npm run test

      - name: Confirm tracked files are unchanged
        run: git diff --exit-code
