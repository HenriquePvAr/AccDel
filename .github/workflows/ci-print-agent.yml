name: CI / Print Agent

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - release/pilot-rc2
      - ci/pilot-rc2-validation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-print-agent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: apps/print-agent

jobs:
  print-agent:
    name: Print Agent build, lint, typecheck and safe tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: apps/print-agent/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build Print Agent
        run: npm run build

      - name: Type-check Print Agent
        run: npm run typecheck

      - name: Lint Print Agent
        run: npm run lint

      - name: Run safe dry-run and loopback tests
        run: npm run test

      - name: Confirm tracked files are unchanged
        run: git -C ../.. diff --exit-code
